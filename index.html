<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Image Finder - Privé</title>
<style>
:root{--purple:#7653c7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter, sans-serif; background:#f8f7ff; display:flex; height:100vh}
aside{width:320px; background:white; border-right:1px solid #eee; padding:20px; overflow-y:auto}
main{flex:1; padding:20px; overflow-y:auto}
.brand{font-weight:800; color:var(--purple); font-size:22px; margin-bottom:20px}
.cat{border:1px solid #e5e5e5; padding:12px; border-radius:12px; margin-bottom:10px; background:#fff}
.cat b{display:block}
.cat button{background:var(--purple); color:white; border:0; padding:6px 12px; border-radius:8px; cursor:pointer; margin-top:6px}
.product-card{background:white; padding:20px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.05)}
.imgs{display:flex; gap:15px; margin-top:15px}
.imgs img{width:200px; height:200px; object-fit:contain; border:2px solid #eee; border-radius:12px; cursor:pointer}
.imgs img.selected{border-color:var(--purple)}
</style>
</head>
<body>
<aside>
  <div class="brand">Image Finder Privé</div>
  <div id="cats">Chargement...</div>
  <hr style="margin:15px 0">
  <button onclick="location.href='/api/export'" style="width:100%; padding:12px; background:#111; color:white; border-radius:10px; border:0">📥 Exporter Excel avec liens</button>
  <p style="font-size:12px; margin-top:10px; color:#666">رابط واحد - تقدري تخدمي نتي وشخص اخر فنفس الوقت</p>
</aside>
<main>
  <h1 id="title">اختار مجموعة من اليسار</h1>
  <div id="product"></div>
  <div style="margin-top:20px">
    <button id="prevBtn">⬅️ السابق</button>
    <button id="nextBtn">التالي ➡️</button>
    <button id="saveBtn" style="background:var(--purple); color:white; padding:10px 20px; border:0; border-radius:10px">حفظ و المرور للتالي</button>
  </div>
</main>
<script>
let categories=[], currentCat=null, products=[], currentIndex=0, selectedImage=null;
async function loadCats(){
  const res = await fetch('/api/categories'); categories=await res.json();
  document.getElementById('cats').innerHTML = categories.map(c=>`
    <div class="cat"><b>${c.id}</b><small>${c.done}/${c.total}</small>
    <div style="height:6px; background:#eee; border-radius:4px"><div style="width:${(c.done/c.total)*100}%; height:100%; background:var(--purple)"></div></div>
    <button onclick="startCat('${c.id}')">Démarrer / Continuer</button></div>`).join('');
}
async function startCat(id){
  currentCat=id; const res=await fetch(`/api/products?cat=${id}`); products=await res.json();
  const prog=await fetch('/api/progress').then(r=>r.json());
  currentIndex = prog[id]?.last ? parseInt(prog[id].last) : 0;
  showProduct();
}
async function showProduct(){
  if(!products[currentIndex]) return;
  const p=products[currentIndex];
  const name=p.Désignation || p.designation || p.Nom || Object.values(p)[0];
  document.getElementById('title').innerText=`${currentCat} - ${currentIndex+1}/${products.length} : ${name}`;
  document.getElementById('product').innerHTML=`<div class="product-card"><h3>${name}</h3><p>جاري البحث عن صور...</p><div id="imgs" class="imgs"></div></div>`;
  const imgs=await fetch(`/api/search?q=${encodeURIComponent(name)}`).then(r=>r.json());
  document.getElementById('imgs').innerHTML=imgs.map((url,i)=>`<img src="${url}" onclick="selectImg(this,'${url}')">`).join('');
}
function selectImg(el,url){ document.querySelectorAll('.imgs img').forEach(i=>i.classList.remove('selected')); el.classList.add('selected'); selectedImage=url; }
async function save(){
  if(!selectedImage) return alert('اختار تصويرة أولا');
  const name=products[currentIndex].Désignation || Object.values(products[currentIndex])[0];
  await fetch('/api/save',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cat:currentCat, index:currentIndex, imageUrl:selectedImage, designation:name})});
  currentIndex++; selectedImage=null; showProduct(); loadCats();
}
document.getElementById('saveBtn').onclick=save;
document.getElementById('nextBtn').onclick=()=>{currentIndex++; showProduct()};
document.getElementById('prevBtn').onclick=()=>{if(currentIndex>0) currentIndex--; showProduct()};
loadCats();
</script>
</body>
</html>
