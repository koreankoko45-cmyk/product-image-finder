<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Finder - Real Search + Auto Save</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#f6f4fb}
.header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #e9e4f1;position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:8px}
.btn{background:#7653c7;color:#fff;border:0;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn2{background:#fff;color:#7653c7;border:1px solid #7653c7;padding:9px 14px;border-radius:10px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:16px}
.card{background:#fff;border:1px solid #e9e4f1;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:180px;object-fit:cover}
.card .m{padding:6px;font-size:11px;word-break:break-all}
.card.sel{outline:3px solid #7653c7}
input{padding:11px;border:1px solid #e9e4f1;border-radius:10px;width:300px}
</style>
</head>
<body>
<div class="header">
<div><b id="cnt">0 محفوظ</b> - <small id="st">الحفظ أوتوماتيك كل 3 ثواني - ما كيضيع والو</small></div>
<div>
<button class="btn2" onclick="restore(true)">استرجاع</button>
<button class="btn2" onclick="clearAll()">مسح</button>
<button class="btn" id="zip">ZIP</button>
<button class="btn" id="xl">Excel</button>
</div>
</div>
<div style="padding:16px">
<input id="q" placeholder="مثلا: robe, eyeliner, montre...">
<button class="btn" id="go">بحث</button>
</div>
<div class="grid" id="grid"></div>

<script>
const KEY='odarym_real_v4';
let selected=JSON.parse(localStorage.getItem(KEY)||'[]');
let allImages=[...selected];
const grid=document.getElementById('grid');
const cnt=document.getElementById('cnt');
const st=document.getElementById('st');

function save(){ localStorage.setItem(KEY, JSON.stringify(selected)); cnt.textContent=selected.length+' محفوظ'; st.textContent='تم الحفظ ✅ '+new Date().toLocaleTimeString()+' - '+selected.length; }
setInterval(save,3000);
window.addEventListener('beforeunload',e=>{ if(selected.length>0){save(); e.preventDefault(); e.returnValue='';} });

function restore(ask){
 const s=JSON.parse(localStorage.getItem(KEY)||'[]');
 if(s.length==0){ if(ask) alert('ما كاين والو'); return;}
 if(ask && !confirm('لقينا '+s.length+' محفوظة نرجعوهم؟')) return;
 selected=s; allImages=[...selected]; render(); save();
}
function clearAll(){ if(confirm('مسح الحفظ؟')){ localStorage.removeItem(KEY); selected=[]; allImages=[]; render(); save(); } }

function render(){
 grid.innerHTML=''; cnt.textContent=selected.length+' محفوظ';
 allImages.forEach(img=>{
   const is=selected.find(x=>x.url===img.url);
   const d=document.createElement('div'); d.className='card'+(is?' sel':'');
   d.innerHTML=`<img src="${img.url}" loading="lazy" onerror="this.src='https://via.placeholder.com/200'"><div class="m"><input type="checkbox" ${is?'checked':''}> ${img.name||''}</div>`;
   d.onclick=()=>{ const i=selected.findIndex(x=>x.url===img.url); if(i>=0) selected.splice(i,1); else selected.push(img); save(); render(); };
   grid.appendChild(d);
 });
}

async function search(q){
 if(!q) return;
 st.textContent='كانقلب على '+q+'...';
 try{
   // كيعيط لـ server.js ديالك اللي فـ Vercel
   const res=await fetch(`/api/search?q=${encodeURIComponent(q)}`);
   if(!res.ok) throw new Error('api fail');
   const data=await res.json();
   const imgs=data.images||data||[];
   // حولهم للشكل ديالنا
   allImages=[...selected, ...imgs.map(u=>typeof u==='string'?{url:u,name:q}:{url:u.url||u.image,name:u.title||q})];
   render(); st.textContent='لقينا '+imgs.length+' - الحفظ خدام';
 }catch(e){
   // إلا ما كاينش api، نخدمو بـ picsum باش ما يبقاش خاوي
   st.textContent='API ما خدامش، كانجيبو تجريبي...';
   const demo=Array.from({length:24}).map((_,i)=>({url:`https://picsum.photos/seed/${encodeURIComponent(q+i)}/400/400`, name:q}));
   allImages=[...selected, ...demo]; render();
 }
}

document.getElementById('go').onclick=()=>search(document.getElementById('q').value
